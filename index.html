<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Translator</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-2: #38bdf8;
        --border: rgba(148, 163, 184, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a 35%, #111827);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: min(960px, calc(100% - 32px));
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.6);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(90deg, rgba(34,197,94,0.12), rgba(56,189,248,0.12));
        border-bottom: 1px solid var(--border);
        padding: 24px 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 28px;
      }

      .card {
        background: rgba(31, 41, 55, 0.8);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }

      .card h2 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      .card p, .card li {
        color: var(--muted);
        line-height: 1.6;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      .button {
        display: inline-block;
        margin-top: 18px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: #03110b;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Secure Translator</h1>
        <p class="subtitle">Dự án đang chuẩn bị chạy trên Next.js</p>
      </div>

      <div class="content">
        <div class="card">
          <h2>Trạng thái</h2>
          <p>File này là một trang tạm để bạn mở nhanh khi dự án chưa chạy bằng Next.js.</p>
          <a class="button" href="#">Mở dự án</a>
        </div>

        <div class="card">
          <h2>Các bước</h2>
          <ul>
            <li>Mở terminal trong thư mục dự án</li>
            <li>Chạy: npm install</li>
            <li>Chạy: npm run dev</li>
            <li>Truy cập: http://localhost:3000</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
